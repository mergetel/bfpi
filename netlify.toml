# Static site, no build step. Netlify serves the repo root as is.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/changelog.xml"
  [headers.values]
    Content-Type = "application/atom+xml; charset=utf-8"
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=600"

# Nothing here is served but the site itself.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true
